[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okx-quant-mvp"
version = "0.3.0"
description = "Config-driven OKX spot backtesting and demo trading framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<2.4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "backtest", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "backtest", "scripts"]
