mode: backtest

exchange:
  name: okx
  simulated: true

market:
  instrument_id: ETH-USDT
  instrument_type: spot
  bar: 1h

strategy:
  name: buy_and_hold
  parameters: {}

position_sizing:
  name: fixed_notional
  parameters:
    order_notional: 20

risk:
  max_order_notional: 20
  max_total_exposure: 100
  max_daily_loss: 10
  max_drawdown_pct: 5
  max_orders_per_minute: 2
  stale_after_seconds: 7200

protective_exits:
  enabled: false
  stop_loss_pct: 1
  take_profit_pct: 2

backtest:
  initial_capital: 10000
  fee_rate: 0.001
  slippage_rate: 0.0005
  seed: 0

data:
  source: okx
  limit: 200
  output: data/eth_usdt_1h.csv

output:
  directory: data/results/eth_buy_hold
