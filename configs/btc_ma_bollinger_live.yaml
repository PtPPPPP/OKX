mode: live

exchange:
  name: okx
  simulated: false

market:
  instrument_id: BTC-USDT
  instrument_type: spot
  bar: 1h

strategy:
  name: ma_bollinger_pullback
  parameters:
    trend_ma_period: 200
    trend_ma_type: ema
    trend_tolerance_pct: 0.03
    bollinger_period: 48
    bollinger_std_dev: 2.0
    min_bandwidth_pct: 0.035
    require_trend_rising: true
    confirm_rebound: false
    exit_band: middle
    exit_on_trend_break: false
    stop_loss_pct: 0.045
    atr_period: 24
    atr_stop_multiplier: 3.0
    max_hold_bars: 96

position_sizing:
  name: risk_per_trade
  parameters:
    risk_pct: 0.005
    default_stop_pct: 0.045
    max_notional_pct: 0.20

risk:
  max_order_notional: 50
  max_total_exposure: 150
  max_daily_loss: 20
  max_drawdown_pct: 10
  max_orders_per_minute: 2
  stale_after_seconds: 3600

protective_exits:
  enabled: false

data:
  source: okx
  limit: 300
  output: data/btc_usdt_1h_live.csv

output:
  directory: data/results/btc_ma_bollinger_live

monitoring:
  alerts_enabled: true
  provider: wecom
  min_level: info
  timeout_seconds: 3.0

