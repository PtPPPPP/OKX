mode: backtest

exchange:
  name: okx
  simulated: true

market:
  instrument_id: BTC-USDT
  instrument_type: spot
  bar: 1h

strategy:
  name: ma_bollinger_pullback
  parameters:
    trend_ma_period: 200
    trend_ma_type: ema
    trend_tolerance_pct: 0.03
    bollinger_period: 48
    bollinger_std_dev: 2.0
    min_bandwidth_pct: 0.035
    require_trend_rising: true
    confirm_rebound: false
    exit_band: middle
    exit_on_trend_break: false
    stop_loss_pct: 0.045
    atr_period: 24
    atr_stop_multiplier: 3.0
    max_hold_bars: 96

position_sizing:
  name: risk_per_trade
  parameters:
    risk_pct: 0.01
    default_stop_pct: 0.045
    max_notional_pct: 0.30

risk:
  max_order_notional: 3500
  max_total_exposure: 4000
  max_daily_loss: 500
  max_drawdown_pct: 20
  max_orders_per_minute: 2
  stale_after_seconds: 3600

protective_exits:
  enabled: false

backtest:
  initial_capital: 10000
  fee_rate: 0.001
  slippage_rate: 0.0005
  seed: 0

data:
  source: csv
  # 默认指向仓库内置 fixture 以便干净 clone 开箱即跑；
  # 3年样本内回测可改为: data/research/rebuilt_v1/historical/normalized/candles.csv
  # 样本外(OOS)回测可改为: data/research/rebuilt_v1/historical_oos/normalized/candles.csv
  path: tests/fixtures/vwap/btc_usdt_1h_600.csv
  limit: 1000
  output: data/btc_usdt_1h.csv
  instrument_snapshot: configs/snapshots/BTC-USDT.json

output:
  directory: data/results/btc_ma_bollinger
